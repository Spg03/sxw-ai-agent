# =====================================================================
# 生产 / 演示环境配置（profile = prod）
# 启动方式（任选其一）：
#   1) IDEA 运行配置：Active profiles = prod
#   2) 命令行：  mvn spring-boot:run -Dspring-boot.run.profiles=prod
#   3) jar 包： java -jar app.jar --spring.profiles.active=prod
#   4) 环境变量：SPRING_PROFILES_ACTIVE=prod
#
# !!! 安全提醒 !!!
# 生产 / 公网演示不要在配置文件中写入真实 Key，请统一通过环境变量注入。
# 对外暴露时建议设置 SXW_SECURITY_API_KEY_ENABLED=true 并配置 SXW_SECURITY_API_KEY。
# =====================================================================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sxw_ai_agent}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
          temperature: 0.7
    # 生产环境默认开启 MCP 服务端，对外暴露技能集
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        name: sxw-ai-agent-mcp
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api/v1
  # 生产环境优雅停机，留 30s 处理在飞请求
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 20s

# searchapi.io：可选，没有也不影响主链路
search-api:
  api-key: ${SEARCH_API_KEY:}

# 业务配置：覆盖 application.yml 的默认值
sxw:
  security:
    api-key:
      enabled: ${SXW_SECURITY_API_KEY_ENABLED:false}
      value: ${SXW_SECURITY_API_KEY:}
  agent:
    runtime:
      max-turns: ${AGENT_MAX_TURNS:10}
      llm-timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
      max-retries: ${LLM_MAX_RETRIES:3}
    trace:
      max-runs: ${SXW_AGENT_TRACE_MAX_RUNS:100}
      max-events-per-run: ${SXW_AGENT_TRACE_MAX_EVENTS_PER_RUN:200}
  skill:
    note:
      base-dir: ${NOTE_BASE_DIR:${user.dir}/data/notes}
      max-file-size-bytes: 2097152          # 2 MB
  cache:
    llm:
      enabled: ${LLM_CACHE_ENABLED:true}
      max-size: ${LLM_CACHE_MAX_SIZE:5000}
      ttl-minutes: ${LLM_CACHE_TTL_MINUTES:60}
  tool:
    terminal:
      # 生产环境强烈建议保持 false，避免被 Agent 误用造成 RCE
      enabled: ${TERMINAL_TOOL_ENABLED:false}
      timeout-seconds: 10
      max-output-chars: 8192
      allowed-commands:
        - echo
        - dir
        - ls
        - pwd
        - whoami
        - hostname
        - date
  rag:
    keyword-enrich:
      # 启动期是否调用 LLM 给文档抽关键词；首次冷启动慢可关掉
      enabled: ${RAG_KEYWORD_ENRICH_ENABLED:false}

# Resilience4j：生产期更严格的限流 / 熔断阈值
resilience4j:
  retry:
    instances:
      dashscope:
        max-attempts: 3
        wait-duration: 800ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      ragflow:
        max-attempts: 2
        wait-duration: 1s
      ollama:
        max-attempts: 1
        wait-duration: 500ms
  ratelimiter:
    instances:
      dashscope:
        limit-for-period: 60
        limit-refresh-period: 1s
        timeout-duration: 0
  circuitbreaker:
    instances:
      dashscope:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 10s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      ragflow:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      ollama:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        register-health-indicator: true
  timelimiter:
    instances:
      ragflow:
        timeout-duration: 10s

# 生产日志：收敛 Spring AI 的 DEBUG 噪声
logging:
  level:
    root: INFO
    org.springframework.ai: INFO
    com.sxw.sxwaiagent: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/sxw-ai-agent.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB

# Actuator：生产环境收紧暴露面，仅保留运维必需端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true       # 暴露 /actuator/health/liveness 与 /readiness，便于 K8s 探针
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: prod
  prometheus:
    metrics:
      export:
        enabled: true
  # 生产环境追踪：降低采样率减少开销
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}/v1/traces
      transport: grpc
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: SXW AI Agent - 企业级 AI Agent 演示（MCP / RAG / 缓存 / 熔断）
    profile: prod

# 生产环境禁用 Swagger / Knife4j，避免 API 文档暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
