spring:
  application:
    name: sxw-ai-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://192.168.26.131:5432/sxw_ai_agent}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:192.168.26.131}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    dashscope:
      # 通过环境变量注入；本地可在 .env 或 shell 中设置 DASHSCOPE_API_KEY
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:gemma3:1b}
    # MCP 服务端：将本项目中的 Skill 以 MCP 协议（SSE）暴露给外部 Agent / Claude Desktop 等
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        name: sxw-ai-agent-mcp
        version: 1.0.0
        type: SYNC
        instructions: "sxw-ai-agent 提供的 MCP 技能集（笔记管理等）"
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
    vectorstore:
      pgvector:
        index-type: ${PGVECTOR_INDEX_TYPE:HNSW}
        dimensions: ${PGVECTOR_DIMENSIONS:1536}
        distance-type: ${PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
        max-document-batch-size: ${PGVECTOR_MAX_BATCH_SIZE:10000}
# 临时注释掉，便于大家开发调试和部署（实际需要启动 MCP 客户端对接外部服务）
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
server:
  port: ${SERVER_PORT:8123}
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.sxw.sxwaiagent.web.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  api-key: ${SEARCH_API_KEY:}
# 业务自定义：技能 / 工具安全沙箱 / 缓存配置
sxw:
  security:
    api-key:
      enabled: ${SXW_SECURITY_API_KEY_ENABLED:false}
      value: ${SXW_SECURITY_API_KEY:}
  agent:
    attachment:
      enabled: ${AGENT_ATTACHMENT_ENABLED:true}
      endpoint: ${MINIO_ENDPOINT:http://192.168.26.131:9000}
      access-key: ${MINIO_ACCESS_KEY:admin}
      secret-key: ${MINIO_SECRET_KEY:admin123456}
      bucket: ${MINIO_BUCKET:sxw-agent-attachments}
      max-bytes: ${AGENT_ATTACHMENT_MAX_BYTES:10485760}
    runtime:
      max-turns: ${AGENT_MAX_TURNS:10}
      llm-timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
      max-retries: ${LLM_MAX_RETRIES:3}
    trace:
      max-runs: ${SXW_AGENT_TRACE_MAX_RUNS:100}
      max-events-per-run: ${SXW_AGENT_TRACE_MAX_EVENTS_PER_RUN:200}
    context:
      max-input-tokens: ${SXW_AGENT_CONTEXT_MAX_INPUT_TOKENS:8192}
      reserved-output-tokens: ${SXW_AGENT_CONTEXT_RESERVED_OUTPUT_TOKENS:2048}
  skill:
    note:
      base-dir: ${NOTE_BASE_DIR:${user.dir}/tmp/notes}
      max-file-size-bytes: 1048576
  cache:
    llm:
      # LLM 应答缓存（Caffeine LRU + TTL），命中相同提问秒级返回 + 降本
      enabled: ${LLM_CACHE_ENABLED:true}
      max-size: ${LLM_CACHE_MAX_SIZE:1000}
      ttl-minutes: ${LLM_CACHE_TTL_MINUTES:30}
  knowledge:
    embedding-model: ${SXW_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v3}
    embedding-model-version: ${SXW_KNOWLEDGE_EMBEDDING_VERSION:1.0}
    chunk-size: ${SXW_KNOWLEDGE_CHUNK_SIZE:1000}
    chunk-overlap: ${SXW_KNOWLEDGE_CHUNK_OVERLAP:100}
    parser-version: ${SXW_KNOWLEDGE_PARSER_VERSION:1.0}
    rrf:
      enabled: ${SXW_KNOWLEDGE_RRF_ENABLED:true}
      k: ${SXW_KNOWLEDGE_RRF_K:60}
  ragflow:
    # RAGFlow 默认关闭；配置 API Key 和 dataset ids 后启用远程知识库检索
    enabled: ${RAGFLOW_ENABLED:false}
    base-url: ${RAGFLOW_BASE_URL:http://localhost:9380}
    api-key: ${RAGFLOW_API_KEY:}
    dataset-ids: ${RAGFLOW_DATASET_IDS:}
    page: ${RAGFLOW_PAGE:1}
    page-size: ${RAGFLOW_PAGE_SIZE:5}
    similarity-threshold: ${RAGFLOW_SIMILARITY_THRESHOLD:0.2}
    vector-similarity-weight: ${RAGFLOW_VECTOR_SIMILARITY_WEIGHT:0.3}
    top-k: ${RAGFLOW_TOP_K:1024}
    keyword: ${RAGFLOW_KEYWORD:false}
    timeout-seconds: ${RAGFLOW_TIMEOUT_SECONDS:10}
    max-context-chars: ${RAGFLOW_MAX_CONTEXT_CHARS:12000}
  tool:
    terminal:
      # 终端工具默认关闭，避免被 Agent 误用造成 RCE；需要时显式打开并限制白名单
      enabled: ${TERMINAL_TOOL_ENABLED:false}
      timeout-seconds: 10
      max-output-chars: 8192
      allowed-commands:
        - echo
        - dir
        - ls
        - pwd
        - whoami
        - hostname
        - date
    validation:
      enabled: ${TOOL_VALIDATION_ENABLED:true}
      max-argument-chars: ${TOOL_VALIDATION_MAX_ARG_CHARS:8192}
  hermes:
    # Hermes 复盘分析器配置
    llm-enabled: ${HERMES_LLM_ENABLED:true}
    min-confidence: ${HERMES_MIN_CONFIDENCE:0.6}
# Resilience4j：外部调用的高可用保护
resilience4j:
  retry:
    instances:
      dashscope:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # 熔断器拒绝时不应再重试，直接快速失败
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      ragflow:
        max-attempts: 2
        wait-duration: 1s
      ollama:
        max-attempts: 1
        wait-duration: 500ms
  ratelimiter:
    instances:
      dashscope:
        limit-for-period: 30
        limit-refresh-period: 1s
        timeout-duration: 0   # 0 = 限速触发立即失败而非阻塞
  circuitbreaker:
    instances:
      dashscope:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      ragflow:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      ollama:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        register-health-indicator: true
  timelimiter:
    instances:
      ragflow:
        timeout-duration: 10s
# 修改日志级别，查看 Spring AI 更多调用细节（生产环境建议设为 INFO）
logging:
  level:
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}
    org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration: 'OFF'
    com.alibaba.cloud.ai.dashscope.embedding.DashScopeEmbeddingModel: 'OFF'
# Actuator 端点（健康检查 + Prometheus 指标）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  # 分布式追踪（Micrometer Tracing + OTel OTLP），本地默认关闭
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces
      transport: grpc
