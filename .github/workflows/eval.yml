name: Eval Suite

# 端到端 LLM 评测：默认不在 CI 跑（会烧 token），只在以下情况触发：
#   1. 手动 (workflow_dispatch)
#   2. 每周一 02:00 UTC 定时
#   3. PR 标 `run-eval` 标签时
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write   # 用于把摘要回贴到 PR

jobs:
  eval:
    name: Run Eval Suite
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-eval'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run eval suite (LoveApp)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_CHAT_MODEL: ${{ vars.DASHSCOPE_CHAT_MODEL || 'qwen-flash' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::DASHSCOPE_API_KEY secret is not set; cannot run eval."
            exit 1
          fi
          mvn -B -ntp test -Dgroups=eval -Dtest=LoveAppEvalSuiteTest

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_number }}
          path: |
            target/eval-report.md
            target/surefire-reports/

      - name: Append report to GitHub Step Summary
        if: always() && hashFiles('target/eval-report.md') != ''
        run: |
          echo "## 🧪 Eval Report (run #${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          cat target/eval-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && hashFiles('target/eval-report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('target/eval-report.md', 'utf8');
            // 只贴 head（避免 PR 评论过长）
            const head = md.split('## Cases')[0];
            const body = `### 🧪 Eval Report (run #${{ github.run_number }})\n\n${head}\n\n_Full report attached as artifact._`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
