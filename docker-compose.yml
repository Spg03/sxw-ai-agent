services:
  sxw-ai-agent:
    build: .
    image: sxw-ai-agent:latest
    container_name: sxw-ai-agent
    ports:
      - "8123:8123"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_CHAT_MODEL: ${DASHSCOPE_CHAT_MODEL:-qwen-plus}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      MCP_SERVER_ENABLED: "true"
      NOTE_BASE_DIR: /data/notes
      SXW_SECURITY_API_KEY_ENABLED: ${SXW_SECURITY_API_KEY_ENABLED:-false}
      SXW_SECURITY_API_KEY: ${SXW_SECURITY_API_KEY:-}
      SXW_AGENT_TRACE_MAX_RUNS: ${SXW_AGENT_TRACE_MAX_RUNS:-100}
      SXW_AGENT_TRACE_MAX_EVENTS_PER_RUN: ${SXW_AGENT_TRACE_MAX_EVENTS_PER_RUN:-200}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - note-data:/data/notes
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sxw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 可选：启用 PgVector 时取消注释，并把 application.yml 的 datasource/vectorstore 打开
  # pgvector:
  #   image: pgvector/pgvector:pg16
  #   container_name: sxw-pgvector
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: sxw_ai
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgvector-data:/var/lib/postgresql/data

volumes:
  note-data:
  redis-data:
  # pgvector-data:
