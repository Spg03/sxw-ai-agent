services:
  sxw-ai-agent:
    build: .
    image: sxw-ai-agent:latest
    container_name: sxw-ai-agent
    ports:
      - "8123:8123"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_CHAT_MODEL: ${DASHSCOPE_CHAT_MODEL:-qwen-plus}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      MCP_SERVER_ENABLED: "true"
      NOTE_BASE_DIR: /data/notes
      SXW_SECURITY_API_KEY_ENABLED: ${SXW_SECURITY_API_KEY_ENABLED:-false}
      SXW_SECURITY_API_KEY: ${SXW_SECURITY_API_KEY:-}
      SXW_AGENT_TRACE_MAX_RUNS: ${SXW_AGENT_TRACE_MAX_RUNS:-100}
      SXW_AGENT_TRACE_MAX_EVENTS_PER_RUN: ${SXW_AGENT_TRACE_MAX_EVENTS_PER_RUN:-200}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://pgvector:5432/sxw_ai_agent}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sxw-ai-agent}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
    volumes:
      - note-data:/data/notes
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: sxw-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus-config
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus-config/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"   # Tempo API
      - "4317:4317"   # OTLP gRPC
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml
      - tempo-data:/tmp/tempo
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      - prometheus
      - tempo
      - loki

  # PgVector 数据库（主数据库 + 向量存储）
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: sxw-pgvector
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: sxw_ai_agent
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - backend

volumes:
  note-data:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  pgvector-data:

networks:
  backend:
    driver: bridge
